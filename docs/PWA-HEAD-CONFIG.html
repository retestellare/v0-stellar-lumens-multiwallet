<!-- PWA Meta Tags and Icons Configuration -->
<!-- Primary Meta Tags -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="ORION - A secure and user-friendly multiwallet for Stellar Lumens (XLM) cryptocurrency" />
<meta name="theme-color" content="#1a3a52" />
<meta name="color-scheme" content="light dark" />

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json" />

<!-- Apple Meta Tags (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ORION Wallet" />

<!-- Apple Touch Icons (iOS Home Screen) -->
<link rel="apple-touch-icon" href="/images/icons/icon-180x180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="/images/icons/icon-152x152.png" />
<link rel="apple-touch-icon" sizes="144x144" href="/images/icons/icon-144x144.png" />
<link rel="apple-touch-icon" sizes="120x120" href="/images/icons/icon-120x120.png" />

<!-- Standard Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/images/icons/favicon-16x16.png" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<!-- Android Chrome Meta Tags -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="ORION Wallet" />

<!-- Microsoft Windows Meta Tags -->
<meta name="msapplication-TileColor" content="#1a3a52" />
<meta name="msapplication-TileImage" content="/images/icons/icon-144x144.png" />
<meta name="msapplication-config" content="/browserconfig.xml" />

<!-- Open Graph (Social Media) -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://yourdomain.com" />
<meta property="og:title" content="ORION Stellar Lumens Wallet" />
<meta property="og:description" content="A secure and user-friendly multiwallet for Stellar Lumens (XLM) cryptocurrency" />
<meta property="og:image" content="/images/og-image-1200x630.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="https://yourdomain.com" />
<meta name="twitter:title" content="ORION Stellar Lumens Wallet" />
<meta name="twitter:description" content="A secure and user-friendly multiwallet for Stellar Lumens (XLM) cryptocurrency" />
<meta name="twitter:image" content="/images/twitter-image-1200x675.png" />

<!-- Additional Web App Features -->
<link rel="canonical" href="https://yourdomain.com" />
<meta name="robots" content="index, follow" />
<meta name="language" content="English" />
<meta name="author" content="ORION Development Team" />

<!-- Preconnect to improve performance -->
<link rel="preconnect" href="https://horizon.stellar.org" />
<link rel="dns-prefetch" href="https://horizon.stellar.org" />
